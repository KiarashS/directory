name: Build and publish

# The site is generated from data/links.yml and the PDFs in assets/. Editing
# either — in the GitHub web editor, or by pushing a commit — is the whole
# publishing workflow: this renders the site into _site/ and deploys it.
#
# Nothing is committed back. The generated HTML is build output, so it lives in
# the Pages artifact and nowhere else.
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "assets/**"
      - "scripts/**"
      - "static/**"
      - "viewer/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      # The PDF model — slugs, path containment, signatures, duplicate routes.
      - name: Test the build
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      # Every check lives in build.py, so there is one definition of how a PDF
      # URL is derived rather than one here and another in the renderer.
      - name: Validate the data and the rendered pages
        run: python3 scripts/build.py --validate

      - name: Render the site
        run: python3 scripts/build.py --output-dir _site

      - name: Check the artifact is complete
        run: |
          test -f _site/index.html
          test -f _site/pdfs/index.html
          test -d _site/assets
          test -d _site/viewer
          test -f _site/sw.js
          echo "viewer routes: $(find _site/v -name index.html | wc -l)"
          du -sh _site

      # enablement:true switches Pages on if it is off, so the site does not
      # need anyone to flip a switch in Settings before the first deploy.
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true
        with:
          enablement: true

      - name: Say so if Pages could not be configured
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::warning::Could not enable GitHub Pages automatically."
          echo "::warning::Set Settings -> Pages -> Source to 'GitHub Actions'."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
