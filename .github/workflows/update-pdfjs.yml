name: Update PDF.js

on:
  schedule:
    # Daily at 03:17 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-pdfjs.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Match the existing Pages workflow so two deployments never overlap.
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.update.outputs.updated }}
      version: ${{ steps.update.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for a newer PDF.js release and update viewer
        id: update
        shell: bash
        run: |
          set -euo pipefail

          release_json="$(curl --fail --silent --show-error --location \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/mozilla/pdf.js/releases/latest)"

          tag="$(jq -r '.tag_name // empty' <<<"$release_json")"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not determine a valid latest PDF.js release tag." >&2
            exit 1
          fi

          version="${tag#v}"
          # The *legacy* build, deliberately. Both are published for every
          # release; the plain -dist.zip is compiled for current browsers only
          # and calls Map.prototype.getOrInsertComputed, which needs Chrome
          # 145, Firefox 144 or Safari 18.4. Below those the viewer throws
          # before it draws anything, so every PDF on the site is a blank page.
          # The legacy build is the same version with core-js polyfills, about
          # 1MB more across the whole viewer.
          asset_name="pdfjs-${version}-legacy-dist.zip"
          asset_url="$(jq -r --arg name "$asset_name" \
            '.assets[] | select(.name == $name) | .browser_download_url' \
            <<<"$release_json" | head -n 1)"

          if [[ -z "$asset_url" || "$asset_url" == "null" ]]; then
            echo "Release asset $asset_name was not found in $tag." >&2
            exit 1
          fi

          current=""
          flavour="none"
          if [[ -f viewer/build/pdf.mjs ]]; then
            current="$(sed -nE 's/.*pdfjsVersion = ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' \
              viewer/build/pdf.mjs | head -n 1)"
            # Only the legacy build carries the polyfill, so its presence is
            # what distinguishes the two flavours of an identical version.
            if grep -q 'getOrInsertComputed: function' viewer/build/pdf.mjs; then
              flavour="legacy"
            else
              flavour="modern"
            fi
          fi

          echo "Current PDF.js: ${current:-unknown} ($flavour)"
          echo "Latest PDF.js:  $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Version alone is not enough: switching flavours leaves the version
          # unchanged, so comparing only that would skip the very update that
          # fixes an installed modern build.
          if [[ "$current" == "$version" && "$flavour" == "legacy" ]]; then
            echo "PDF.js is already current, and is the legacy build."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$current" == "$version" ]]; then
            echo "Same version, but the installed build is $flavour — refetching as legacy."
          fi

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          curl --fail --silent --show-error --location \
            "$asset_url" -o "$tmp/pdfjs.zip"
          unzip -q "$tmp/pdfjs.zip" -d "$tmp/dist"

          dist_root=""
          if [[ -d "$tmp/dist/build" && -d "$tmp/dist/web" ]]; then
            dist_root="$tmp/dist"
          else
            while IFS= read -r candidate; do
              if [[ -d "$candidate/build" && -d "$candidate/web" ]]; then
                dist_root="$candidate"
                break
              fi
            done < <(find "$tmp/dist" -mindepth 1 -maxdepth 2 -type d -print)
          fi

          if [[ -z "$dist_root" ]]; then
            echo "Downloaded archive does not contain both build/ and web/." >&2
            exit 1
          fi

          rm -rf viewer/build viewer/web
          cp -a "$dist_root/build" viewer/build
          cp -a "$dist_root/web" viewer/web

          detected="$(sed -nE 's/.*pdfjsVersion = ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' \
            viewer/build/pdf.mjs | head -n 1)"
          if [[ "$detected" != "$version" ]]; then
            echo "Version verification failed: expected $version, found ${detected:-unknown}." >&2
            exit 1
          fi

          # Fail loudly rather than publishing a reader that is blank for
          # anyone below Chrome 145 — if a future release stops shipping the
          # polyfill, that is worth a red job, not a silent deploy.
          if ! grep -q 'getOrInsertComputed: function' viewer/build/pdf.mjs; then
            echo "Downloaded build has no core-js polyfill: this is not the legacy build." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A viewer/build viewer/web

          if git diff --cached --quiet; then
            echo "The release produced no repository changes."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "chore(pdf.js): update to v${version}"
          git push origin HEAD:main
          echo "updated=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.updated == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out updated main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      # The pages are build output, not repository content, so a deploy has to
      # render them. This job only ever changes viewer/, but it still publishes
      # a whole site, and that site needs its HTML.
      - name: Render the site
        run: |
          python3 scripts/build.py --validate
          python3 scripts/build.py --output-dir _site
          du -sh _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
