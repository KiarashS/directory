name: Check external links

# Link rot is the quiet failure mode of a link directory: nothing breaks, the
# site keeps building, and a shelf slowly fills with dead ends.
#
# This never fails the build and never blocks a deploy. It opens one issue
# listing what looks dead and leaves the triage to a person — a link that has
# moved needs a new URL, not a red X on an unrelated commit.
on:
  schedule:
    - cron: "17 6 * * 1"      # Mondays, early
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml

      - name: Check every external link
        id: check
        run: |
          python3 - <<'PY' > dead.md
          import concurrent.futures as cf, pathlib, urllib.error, urllib.request, yaml

          doc = yaml.safe_load(pathlib.Path("data/links.yml").read_text(encoding="utf-8"))

          # url -> the entry it belongs to, so the issue says what to go and fix
          where = {}
          for cat in doc["categories"]:
              for entry in cat.get("entries") or []:
                  for item, text in [(entry, entry["title"])] + [
                          (l, f'{entry["title"]} -> {l.get("text", "")}')
                          for l in entry.get("links") or []]:
                      u = item.get("url", "")
                      if u.startswith(("http://", "https://")):
                          where.setdefault(u, (cat["slug"], text))

          UA = {"User-Agent": "Mozilla/5.0 (compatible; directory-link-check/1.0)"}

          def probe(url):
              """(status, note). A site that refuses a bot is not a dead link."""
              for attempt in (1, 2):
                  try:
                      req = urllib.request.Request(url, headers=UA, method="GET")
                      with urllib.request.urlopen(req, timeout=25) as r:
                          return r.status, ""
                  except urllib.error.HTTPError as ex:
                      # 403/429 mean "not to a robot", not "gone".
                      if ex.code in (403, 429, 401, 405):
                          return ex.code, "blocked to bots, not necessarily dead"
                      if attempt == 2:
                          return ex.code, ""
                  except Exception as ex:
                      if attempt == 2:
                          return 0, type(ex).__name__
              return 0, "unknown"

          with cf.ThreadPoolExecutor(8) as pool:
              results = dict(zip(where, pool.map(probe, where)))

          # Only genuinely gone: the page is missing, or the host does not
          # resolve. Everything else is reported as a footnote, not a finding.
          dead = {u: r for u, r in results.items() if r[0] in (404, 410)}
          unreachable = {u: r for u, r in results.items()
                         if r[0] == 0 and "blocked" not in r[1]}

          print(f"Checked **{len(where)}** external links.\n")
          if dead:
              print(f"### Gone ({len(dead)})\n")
              for u, (code, _) in sorted(dead.items()):
                  slug, title = where[u]
                  print(f"- `{code}` [{title}]({u}) — in `{slug}`")
              print()
          if unreachable:
              print(f"### No response ({len(unreachable)}) — may be transient\n")
              for u, (_, note) in sorted(unreachable.items()):
                  slug, title = where[u]
                  print(f"- [{title}]({u}) — `{note}`, in `{slug}`")
              print()
          if not dead and not unreachable:
              print("Nothing is broken.")
          PY

          cat dead.md
          if grep -q "^### " dead.md; then echo "found=true" >> "$GITHUB_OUTPUT"; fi

      - name: Open or update the issue
        if: steps.check.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Dead external links"
          body="$(cat dead.md)

          _Found by \`.github/workflows/link-check.yml\`. Edit \`data/links.yml\` to fix or remove them._"
          existing="$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
