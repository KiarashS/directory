# The directory's content. Everything on the site is built from this file.
#
# Each category becomes a real page at /<slug>/ — /pdfs/, /links/ and so on.
#
# An entry needs a title and a destination. Anything with extra `links` renders
# as a card that opens a modal listing all of them.
#
#   - title: Fluent Python 2nd Edition
#     url: https://example.com/book
#     description: Optional. Shown in a popover behind an (i) button.
#     tags: [python, reference]     # optional; searchable, and clickable chips
#     pinned: true                  # optional; holds the entry at the top
#     added: 2026-08-28             # optional; the default sort is newest first
#     links:
#       - text: Errata
#         url: https://example.com/errata
#
# A destination is either `url:` (external, opens in a new tab) or `pdf:` (one
# of your own files in assets/). Never both on the same item.
#
#   - title: Explainable AI Cheat Sheet
#     pdf: xai-cheat-sheet.pdf       # -> assets/xai-cheat-sheet.pdf
#     slug: xai-cheat-sheet          # optional; derived from the filename
#
# `pdf:` is all it takes: the build validates the file, generates the reader
# page at /v/<slug>/ and links the card to it. Nothing under v/ is written by
# hand, and none of it lives in this repository — it is generated at build time.
#
# A slug is a public URL. Changing one on something already published breaks
# every link to it, so every PDF below states its slug rather than relying on
# the derived one. `pdf:` works the same way in a nested `links:` list and in a
# course's `materials:`.
#
# Nothing is fetched or generated — a `description` exists only if you write it.
#
# Entries with no `added` keep the order they have in this file and sit below
# the dated ones, so adding dates gradually does not scramble anything.
#
# Talks take three more optional fields, shown as a line under the title:
#
#   - title: Making a static site searchable
#     pdf: slides-deck.pdf
#     event: PyCon
#     by: Kiarash Soleimanzadeh      # optional presenter
#     location: Tehran, Iran         # optional
#     date: 2026-05-14
#     tags: [talk, search]
#     links:
#       - text: Recording
#         url: https://example.com/video
#
# Courses are different: each one gets its own page at /courses/<slug>/, with
# its materials grouped into modules. Paste this under `courses:` to start one.
#
#   - slug: intro-ml
#     title: Introduction to Machine Learning
#     institution: Sharif University of Technology
#     instructor: Some Lecturer
#     term: Spring 2026
#     description: One or two lines about the course.
#     links:
#       - text: Syllabus
#         pdf: syllabus.pdf
#     modules:
#       - title: Week 1 — Linear regression
#         summary: Optional line under the module heading.
#         materials:
#           - title: Lecture slides
#             pdf: wk1-slides.pdf
#             type: slides         # slides notes assignment reading video code dataset
